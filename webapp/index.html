<style>
  :root{
    --bg: var(--tg-theme-bg-color, #f4f6fb);
    --card: var(--tg-theme-secondary-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #172033);
    --hint: var(--tg-theme-hint-color, #7c8799);
    --link: var(--tg-theme-link-color, #4f7cff);
    --btn: var(--tg-theme-button-color, #4f7cff);
    --btn-text: var(--tg-theme-button-text-color, #ffffff);
    --accent: linear-gradient(135deg,#5b8cff,#8b5cf6);
    --line: rgba(120,135,160,.18);
    --ok: #22c55e;
    --warn: #f59e0b;
    --err: #ef4444;
    --radius: 18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    font-size:15px;line-height:1.45;overscroll-behavior-y:contain}
  body{padding-bottom:86px}
  a{color:var(--link);text-decoration:none}
  .wrap{max-width:640px;margin:0 auto;padding:14px 14px 0}
  .top{display:flex;align-items:center;gap:12px;padding:8px 2px 14px}
  .avatar{width:44px;height:44px;border-radius:50%;background:var(--accent);color:#fff;
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;flex:0 0 auto}
  .hello{flex:1;min-width:0}
  .hello b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hello span{font-size:12.5px;color:var(--hint)}
  .pill{background:var(--card);border:1px solid var(--line);border-radius:999px;
    padding:7px 12px;font-size:12.5px;font-weight:600;white-space:nowrap}
  h2{font-size:15px;margin:18px 2px 10px;color:var(--hint);font-weight:600;letter-spacing:.2px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .svc{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px;display:flex;flex-direction:column;gap:6px;cursor:pointer;transition:transform .12s,box-shadow .12s}
  .svc:active{transform:scale(.97)}
  .svc .emoji{font-size:22px}
  .svc .name{font-weight:600;font-size:14px}
  .svc .meta{font-size:11.5px;color:var(--hint)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px}
  label{display:block;font-size:12.5px;color:var(--hint);margin:10px 2px 6px;font-weight:600}
  input,textarea,select{width:100%;padding:12px 13px;border-radius:14px;border:1px solid var(--line);
    background:var(--bg);color:var(--text);font-size:15px;font-family:inherit;outline:none}
  input:focus,textarea:focus,select:focus{border-color:var(--btn)}
  textarea{min-height:84px;resize:vertical}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg);
    font-size:13.5px;font-weight:600;cursor:pointer;color:var(--text)}
  .chip.sel{background:var(--btn);border-color:var(--btn);color:var(--btn-text)}
  .row{display:flex;gap:10px}
  .row>*{flex:1}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px;
    border-radius:16px;border:none;background:var(--btn);color:var(--btn-text);
    font-size:15.5px;font-weight:700;cursor:pointer;font-family:inherit}
  .btn:disabled{opacity:.5}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
  .btn.small{padding:11px;font-size:14px;border-radius:13px}
  .btn.danger{background:var(--err)}
  .stack{display:flex;flex-direction:column;gap:10px}
  .muted{color:var(--hint);font-size:12.5px}
  .center{text-align:center}
  .head{display:flex;align-items:center;gap:10px;margin:6px 0 14px}
  .back{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--card);
    color:var(--text);font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .head h1{font-size:18px;margin:0}
  .progress{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:14px 0 6px}
  .progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .4s}
  .spinner{width:26px;height:26px;border-radius:50%;border:3px solid var(--line);
    border-top-color:var(--btn);animation:spin 1s linear infinite;margin:0 auto 10px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .order{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
  .order:last-child{border-bottom:none}
  .order .ico{width:38px;height:38px;border-radius:12px;background:var(--bg);display:flex;
    align-items:center;justify-content:center;font-size:18px;flex:0 0 auto}
  .order .body{flex:1;min-width:0}
  .order .body b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .order .body span{font-size:11.5px;color:var(--hint)}
  .empty{text-align:center;color:var(--hint);padding:32px 10px}
  .tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
    display:flex;padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:20}
  .tabs button{flex:1;background:none;border:none;color:var(--hint);font-size:11.5px;font-weight:600;
    display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;cursor:pointer;font-family:inherit}
  .tabs button .ic{font-size:19px;line-height:1}
  .tabs button.on{color:var(--btn)}
  .toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);
    background:#111827;color:#fff;padding:11px 16px;border-radius:12px;font-size:13px;
    opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:88%;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;
    background:rgba(79,124,255,.12);color:var(--btn)}
  .field-note{font-size:11.5px;color:var(--hint);margin:4px 2px 0}
  .kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
  .order.tap{cursor:pointer}
  .order.tap:active{background:rgba(127,127,127,.12)}
  .chev{margin-left:auto;color:var(--hint);font-size:22px;line-height:1}
  .chat-list{display:flex;flex-direction:column;gap:8px;margin-bottom:12px;min-height:200px}
  .bubble{max-width:86%;padding:10px 12px;border-radius:14px;font-size:14px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
  .bubble.me{align-self:flex-end;background:var(--btn,#3b82f6);color:#fff;border-bottom-right-radius:4px}
  .bubble.ai{align-self:flex-start;background:rgba(127,127,127,.16);border-bottom-left-radius:4px}
  .chat-bar{position:sticky;bottom:0;display:flex;gap:8px;padding:10px 0;background:var(--bg,transparent)}
  .chat-bar textarea{flex:1;min-height:44px;max-height:110px;resize:none}
  .chat-bar button{width:auto;padding:0 16px}
  .kv:last-child{border-bottom:none}
  .kv span{color:var(--hint)}
  .loading{display:flex;flex-direction:column;align-items:center;padding:60px 0;color:var(--hint)}
</style>
</head>

  clearTimeout(toastEl._timer); toastEl._timer = setTimeout(() => toastEl.classList.remove("show"), 2400);
}
function fmtSize(bytes){ if(!bytes) return ""; const kb = bytes/1024; return kb > 1024 ? (kb/1024).toFixed(1)+" MB" : Math.round(kb)+" KB"; }
function fmtDate(ts){ try { return new Date(ts*1000).toLocaleDateString(); } catch(e){ return ""; } }

async function api(path, options){
  const response = await fetch(path, Object.assign({headers:{"Content-Type":"application/json"}}, options));
  let data = {};
  try { data = await response.json(); } catch(e){ data = {}; }
  if(!response.ok || data.ok === false){ throw new Error((data && data.message) || ("HTTP " + response.status)); }
  return data;
}

async function buildPlan(){

  const button = document.getElementById("planBtn");
  button.disabled = true; button.textContent = "⏳ " + t("creating");
  try {
    const data = await api("/api/mini/plan", {method:"POST", body: JSON.stringify({
      token: state.token, topic, lang: state.form.lang,
      pages: parseInt(state.form.pages || "3", 10)})});
    state.plan = data.plan || "";
    renderPlan();
  } catch (error) {
    toast(error.message || t("error"));
  } finally {
    if (button) { button.disabled = false; button.textContent = "📋 " + t("plan"); }

async function startGeneration(){
  const topic = (state.form.topic || "").trim();
  if (topic.length < 3) return toast(t("needTopic"));
  const item = state.service;
  const options = currentOptions();

  const button = document.getElementById("go");
  if (button) { button.disabled = true; button.textContent = "⏳ " + t("creating"); }
  try {
    const payload = {
      token: state.token, service: item.code, topic, lang: state.form.lang,
      format: state.form.format, options, author: state.form.author,
      institution: state.form.institution, faculty: state.form.faculty,
      dept: state.form.dept, subject: state.form.subject, checker: state.form.checker,
      email: state.form.email, design_key: state.form.design_key,
      plan: state.plan
    };
    const data = await api("/api/mini/generate", {method:"POST", body: JSON.stringify(payload)});
    state.job = data.job;
    renderProgress();
  } catch (error) {
    toast(error.message || t("error"));
    if (button) { button.disabled = false; button.textContent = t("make") + " →"; }
  }
}

const STAGES = {queued:["queued",10], writing:["writing",35], images:["images",55],
                building:["building",75], convert:["convert",88], done:["ready",100]};

function renderProgress(){
  const stage = STAGES.queued;
  app.innerHTML = `<div class="wrap">
    <div class="head"><button class="back" id="back">‹</button><h1>${esc(t("creating"))}</h1></div>
    <div class="card center" style="padding:26px 18px">
      <div class="spinner"></div>
      <h3 id="stageText" style="margin:8px 0 2px">${esc(t(stage[0]))}</h3>
      <p class="muted">${esc(t("wait"))}</p>
      <div class="progress"><i id="bar" style="width:8%"></i></div>
      <p class="muted" id="elapsed">0 s</p>
    </div>
  </div>`;
  document.getElementById("back").onclick = () => { state.tab = "home"; state.service = null; state.job = null; render(); };
  let ticks = 0;
  const timer = setInterval(() => { ticks += 2; const el = document.getElementById("elapsed"); if (el) el.textContent = ticks + " s"; }, 2000);
  pollJob(timer);
}

async function pollJob(timer){
  try {
    const data = await api(`/api/mini/job?id=${encodeURIComponent(state.job)}&token=${encodeURIComponent(state.token)}`);
    const stage = STAGES[data.stage] || STAGES.writing;
    const textEl = document.getElementById("stageText");
    const barEl = document.getElementById("bar");
    if (textEl) textEl.textContent = data.status === "error" ? t("error") : t(stage[0]);
    if (barEl) barEl.style.width = (data.status === "error" ? 100 : stage[1]) + "%";
    if (data.status === "done"){ clearInterval(timer); return renderDone(data); }
    if (data.status === "error"){ clearInterval(timer); return renderError(data.error); }
    setTimeout(() => pollJob(timer), 1800);
  } catch (error) {
    clearInterval(timer);
    renderError(error.message);
  }
}

function renderDone(data){
  const href = `/api/mini/download?id=${encodeURIComponent(state.job)}&token=${encodeURIComponent(state.token)}`;

function remakeOrder(order){
  const item = state.services.find(s => s.code === order.service);
  state.orderDetail = null;
  if (!item) { state.tab = "home"; state.service = null; render(); return; }
  state.service = item; state.tab = "home"; state.job = null; state.plan = "";
  state.form.topic = order.topic || "";
  const options = order.options || {};
  if (options.pages) state.form.pages = String(options.pages);
  if (options.words) state.form.words = String(options.words);
  if (options.questions) state.form.questions = String(options.questions);
  if (options.count) state.form.count = options.count;
  render();
}

function renderChat(){
  const bubbles = state.chat.map(m =>
    `<div class="bubble ${m.role === "assistant" ? "ai" : "me"}">${esc(m.content)}</div>`).join("");
  app.innerHTML = `<div class="wrap">
    <h2>💬 ${esc(t("chat"))}</h2>
    <div class="chat-list" id="chatList">${bubbles || `<div class="empty">💬<br>${esc(t("chatEmpty"))}</div>`}</div>
    <div class="chat-bar">
      <textarea id="chatText" placeholder="${esc(t("chatPh"))}">${esc(state.chatDraft || "")}</textarea>
      <button class="btn" id="chatSend" ${state.chatBusy ? "disabled" : ""}>➤</button>
    </div>
  </div>`;
  const list = document.getElementById("chatList");
  list.scrollTop = list.scrollHeight;
  const box = document.getElementById("chatText");
  box.oninput = () => { state.chatDraft = box.value; };
  document.getElementById("chatSend").onclick = () => sendChat();
  box.onkeydown = (event) => {
    if (event.key === "Enter" && !event.shiftKey) { event.preventDefault(); sendChat(); }
  };
}

async function sendChat(){
  const text = (document.getElementById("chatText").value || "").trim();
  if (!text || state.chatBusy) return;
  state.chatDraft = "";
  state.chat.push({role:"user", content:text});
  state.chat.push({role:"assistant", content:t("chatThinking")});
  state.chatBusy = true;
  renderChat();
  try {
    const data = await api("/api/mini/chat", {method:"POST", body: JSON.stringify({token: state.token, message: text, lang: state.lang})});
    state.chat[state.chat.length - 1] = {role:"assistant", content: data.answer};
  } catch (error) {
    state.chat[state.chat.length - 1] = {role:"assistant", content: "⚠️ " + (error.message || t("error"))};
  }
  state.chatBusy = false;
  if (state.tab === "chat") renderChat();
}

async function loadChat(){
  try {
    const data = await api(`/api/mini/chat?token=${encodeURIComponent(state.token)}`);
    state.chat = data.messages || [];
  } catch (error) { state.chat = []; }
}

function renderProfile(){
  const user = state.user;
  const botLink = "https://t.me/" + (window.__BOT_USERNAME__ || "Talaba_AI_SlideBot");
  app.innerHTML = `<div class="wrap">${header()}
    <h2>${esc(t("profile"))}</h2>
    <div class="card">
      <div class="kv"><span>${esc(t("bal"))}</span><b>${user.balance||0} so‘m</b></div>
      <div class="kv"><span>${esc(t("bonus"))}</span><b>${user.bonus_balance||0} so‘m</b></div>
      <div class="kv"><span>${esc(t("premium"))}</span><b>${user.premium ? "✅" : "—"}</b></div>
      <div class="kv"><span>${esc(t("ordersCount"))}</span><b>${state.history.length}</b></div>
    </div>
    <h2>${esc(t("lang"))}</h2>
    <div class="card"><div class="chips">${LANGS.map(([code, name]) =>
      `<div class="chip ${state.lang===code?"sel":""}" data-plang="${code}">${esc(name)}</div>`).join("")}</div></div>
    <div class="stack"><a class="btn ghost" href="${botLink}" target="_blank" rel="noopener">🤖 ${esc(t("openBot"))}</a></div>
    <p class="muted center" style="margin:16px 0">Talaba AI Mini App</p>
  </div>`;
  app.querySelectorAll("[data-plang]").forEach(node => node.onclick = () => {
    state.lang = node.dataset.plang; state.form.lang = state.lang;
    try { localStorage.setItem("mini_lang", state.lang); } catch(e){}
    render();
  });
}

document.getElementById("tabs").addEventListener("click", async (event) => {
  const button = event.target.closest("button[data-tab]");
  if (!button) return;
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b === button));
  state.tab = button.dataset.tab; state.service = null; state.orderDetail = null;
  if (state.tab === "chat" && !state.chatLoaded) { state.chatLoaded = true; await loadChat(); }
  render();
});

const stored = (() => { try { return localStorage.getItem("mini_lang"); } catch(e){ return null; } })();
if (stored) state.lang = stored;
bootFromTelegram();
</script>
</body>
</html>
